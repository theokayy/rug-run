<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Rug Run | Meme Madness</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 0;
            background: #0d0d12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #arcade-wrapper {
            position: relative;
            width: 100%;
            max-width: 720px;
            background: #151520;
            border: 2px solid #8b5cf6;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.35);
            padding: 20px;
            text-align: center;
        }

        /* --- Header & Title --- */
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin: 0 0 15px 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* --- Character Selector Grid --- */
        #character-select {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .char-card {
            background: #1e1e2d;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 8px 4px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .char-card:hover, .char-card.selected {
            border-color: #a855f7;
            background: #27273a;
            transform: translateY(-2px);
        }

        .char-card.selected {
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        .char-preview {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            margin: 0 auto 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2e2e42;
            overflow: hidden;
            font-size: 1.5rem;
        }

        .char-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .char-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* --- Canvas Container --- */
        #game-area {
            position: relative;
            width: 100%;
            height: 240px;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- Overlay Screens --- */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        .btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-decoration: none;
            display: inline-block;
            margin: 6px;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-green { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-dark { background: #334155; }

        .score-pill {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .controls-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div id="arcade-wrapper">
    <h1>The Rug Run</h1>
    <p class="subtitle">Dodge the Red Candles & Rugs | Meme Madness</p>

    <!-- Character Grid with Image Previews and Emoji Fallbacks -->
    <div id="character-select">
        <div class="char-card selected" onclick="selectCharacter('troll', '😈', '#f97316')">
            <div class="char-preview">
                <img src="troll.png" alt="Troll" onerror="this.parentElement.innerHTML='😈'">
            </div>
            <div class="char-name">Troll</div>
        </div>
        <div class="char-card" onclick="selectCharacter('triple_t', '🗿', '#d97706')">
            <div class="char-preview">
                <img src="triple_t.png" alt="Triple T" onerror="this.parentElement.innerHTML='🗿'">
            </div>
            <div class="char-name">Triple T</div>
        </div>
        <div class="char-card" onclick="selectCharacter('jimothy', '🦝', '#2563eb')">
            <div class="char-preview">
                <img src="jimothy.png" alt="Jimothy" onerror="this.parentElement.innerHTML='🦝'">
            </div>
            <div class="char-name">Jimothy</div>
        </div>
        <div class="char-card" onclick="selectCharacter('neet', '🐸', '#16a34a')">
            <div class="char-preview">
                <img src="neet.png" alt="Neet" onerror="this.parentElement.innerHTML='🐸'">
            </div>
            <div class="char-name">Neet</div>
        </div>
        <div class="char-card" onclick="selectCharacter('chillhouse', '🏠', '#64748b')">
            <div class="char-preview">
                <img src="chillhouse.png" alt="Chillhouse" onerror="this.parentElement.innerHTML='🏠'">
            </div>
            <div class="char-name">Chillhouse</div>
        </div>
        <div class="char-card" onclick="selectCharacter('ket', '🐱', '#9333ea')">
            <div class="char-preview">
                <img src="ket.png" alt="Ket" onerror="this.parentElement.innerHTML='🐱'">
            </div>
            <div class="char-name">Ket</div>
        </div>
        <div class="char-card" onclick="selectCharacter('cupsey', '👶', '#10b981')">
            <div class="char-preview">
                <img src="cupsey.png" alt="Cupsey" onerror="this.parentElement.innerHTML='👶'">
            </div>
            <div class="char-name">Cupsey</div>
        </div>
    </div>

    <!-- Canvas Game Area -->
    <div id="game-area">
        <canvas id="canvas" width="700" height="240"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-overlay" class="overlay">
            <h2 style="margin:0 0 10px 0; color:#38bdf8;">Ready for Meme Madness?</h2>
            <button class="btn" onclick="startGame()">TAP OR PRESS SPACE TO RUN</button>
            <div class="controls-hint">Desktop: [SPACE / ↑] Jump | [↓] Duck | Mobile: Tap Screen</div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="overlay hidden">
            <h2 style="margin:0 0 4px 0; color:#ef4444;">YOU GOT RUGGED! 💥</h2>
            <div class="score-pill" id="score-display">Score: 0 | High: 0</div>
            
            <div>
                <!-- REPLACE YOUR REFERRAL LINK HERE -->
                <a href="https://cade.market" target="_blank" class="btn btn-green">
                    Win $100K on Cade Market 🚀
                </a>
                <button class="btn btn-dark" onclick="restartGame()">Try Again 🔄</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Audio FX Generator (Synthesized with Web Audio API)
    const AudioEngine = {
        ctx: null,
        init() {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        playJump() {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
            osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        },
        playHit() {
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.frequency.setValueAtTime(220, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.25);
            osc.start(); osc.stop(this.ctx.currentTime + 0.25);
        }
    };

    // Game State
    let state = "IDLE";
    let score = 0;
    let highScore = parseInt(localStorage.getItem("rug_run_highscore") || "0");
    let speed = 6;
    let frame = 0;

    // Character State
    let selectedChar = {
        name: 'troll',
        emoji: '😈',
        color: '#f97316',
        img: new Image()
    };
    selectedChar.img.src = 'troll.png';

    function selectCharacter(name, emoji, color) {
        selectedChar.name = name;
        selectedChar.emoji = emoji;
        selectedChar.color = color;
        selectedChar.img.src = `${name}.png`;

        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    // Player Object
    const player = {
        x: 60,
        y: 160,
        baseY: 160,
        width: 36,
        height: 44,
        dy: 0,
        gravity: 0.65,
        jumpForce: -11,
        grounded: true,
        ducking: false,
        reset() {
            this.y = this.baseY;
            this.dy = 0;
            this.grounded = true;
            this.ducking = false;
            this.height = 44;
        },
        jump() {
            if (this.grounded) {
                this.dy = this.jumpForce;
                this.grounded = false;
                AudioEngine.playJump();
            }
        },
        duck(isDucking) {
            if (this.grounded) {
                this.ducking = isDucking;
                this.height = isDucking ? 24 : 44;
                this.y = isDucking ? this.baseY + 20 : this.baseY;
            } else if (isDucking) {
                this.dy += 1.5;
            }
        },
        update() {
            if (!this.grounded) {
                this.dy += this.gravity;
                this.y += this.dy;
                if (this.y >= this.baseY) {
                    this.y = this.baseY;
                    this.dy = 0;
                    this.grounded = true;
                }
            }
        },
        draw() {
            if (selectedChar.img.complete && selectedChar.img.naturalWidth !== 0) {
                ctx.drawImage(selectedChar.img, this.x, this.y, this.width, this.height);
            } else {
                ctx.fillStyle = selectedChar.color;
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();
                ctx.font = `${this.ducking ? '16px' : '22px'} sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(selectedChar.emoji, this.x + this.width / 2, this.y + (this.ducking ? 18 : 28));
            }
        }
    };

    // Obstacles
    let obstacles = [];
    class Obstacle {
        constructor() {
            this.type = Math.random() > 0.35 ? "CANDLE" : "FUD";
            this.x = canvas.width + 20;
            this.speed = speed;

            if (this.type === "CANDLE") {
                this.width = 18;
                this.height = Math.floor(Math.random() * 25) + 35;
                this.y = canvas.height - 36 - this.height;
            } else {
                this.width = 34;
                this.height = 20;
                this.y = canvas.height - 36 - 55;
            }
        }
        update() {
            this.x -= this.speed;
        }
        draw() {
            if (this.type === "CANDLE") {
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = "#fca5a5";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y - 8);
                ctx.lineTo(this.x + this.width / 2, this.y + this.height + 8);
                ctx.stroke();
            } else {
                ctx.fillStyle = "#6366f1";
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px monospace";
                ctx.textAlign = "center";
                ctx.fillText("FUD", this.x + this.width / 2, this.y + 14);
            }
        }
    }

    // Input Listeners
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "ArrowUp") {
            if (state === "RUNNING") player.jump();
            else if (state === "IDLE") startGame();
            e.preventDefault();
        }
        if (e.code === "ArrowDown" && state === "RUNNING") {
            player.duck(true);
            e.preventDefault();
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowDown") player.duck(false);
    });

    canvas.addEventListener("touchstart", (e) => {
        if (state === "RUNNING") player.jump();
        else if (state === "IDLE") startGame();
        e.preventDefault();
    }, { passive: false });

    // State Transitions
    function startGame() {
        state = "RUNNING";
        score = 0;
        speed = 6;
        obstacles = [];
        frame = 0;
        player.reset();
        document.getElementById("start-overlay").classList.add("hidden");
        document.getElementById("gameover-overlay").classList.add("hidden");
    }

    function restartGame() {
        startGame();
    }

    function triggerGameOver() {
        state = "GAMEOVER";
        AudioEngine.playHit();
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("rug_run_highscore", highScore);
        }
        document.getElementById("score-display").innerText = `Score: ${score} | High: ${highScore}`;
        document.getElementById("gameover-overlay").classList.remove("hidden");
    }

    // Game Loop
    function loop() {
        ctx.fillStyle = "#0b0f19";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const groundY = canvas.height - 36;
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(0, groundY, canvas.width, 36);
        ctx.strokeStyle = "#8b5cf6";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        if (state === "RUNNING") {
            frame++;
            if (frame % 5 === 0) score++;
            if (frame % 400 === 0 && speed < 14) speed += 0.5;

            if (frame % Math.max(50, Math.floor(110 - speed * 4)) === 0) {
                obstacles.push(new Obstacle());
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.speed = speed;
                obs.update();
                obs.draw();

                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.height + player.y > obs.y
                ) {
                    triggerGameOver();
                }

                if (obs.x + obs.width < 0) obstacles.splice(i, 1);
            }

            player.update();
        }

        player.draw();

        ctx.fillStyle = "#38bdf8";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "right";
        ctx.fillText(`SCORE: ${score}`, canvas.width - 20, 30);
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(`HI: ${highScore}`, canvas.width - 20, 52);

        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
